<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Enquiry sent</title>
<meta name="description" content="Send a vacuum pump spares enquiry: pump brand, model, part needed and a nameplate photo. Rotary vane, dry screw and claw pumps of any brand.">
<meta property="og:title" content="Vacuum Pump Spares Enquiry | Mechvac Technologies">
<meta property="og:description" content="Send your pump details and nameplate photo. Spares for any brand of rotary vane, dry screw and claw vacuum pumps.">
<meta property="og:image" content="https://het-patel.work.gd/application/img/mechvac-pumps.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
:root{
  --bg:#fbfbfa; --surface:#ffffff; --surface-2:#f3f3f1; --line:#e7e7e3;
  --text:#121212; --muted:#6b6b66; --faint:#9a9a94;
  --accent:#0b8aa3; --accent-ink:#ffffff; --accent-soft:#e3f3f6;
  --danger:#c2410c;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --radius:14px;
  --shadow:0 1px 0 rgba(0,0,0,.03),0 8px 24px -12px rgba(0,0,0,.12);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0c; --surface:#141414; --surface-2:#1b1b1b; --line:#262626;
    --text:#ededed; --muted:#a1a1a1; --faint:#6e6e6e;
    --accent:#3cc3dc; --accent-ink:#06262d; --accent-soft:#0f2a30; --danger:#fb923c;
    --shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c0c; --surface:#141414; --surface-2:#1b1b1b; --line:#262626;
  --text:#ededed; --muted:#a1a1a1; --faint:#6e6e6e;
  --accent:#3cc3dc; --accent-ink:#06262d; --accent-soft:#0f2a30; --danger:#fb923c;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-weight:600;display:flex;gap:8px}.brand .back{color:var(--faint);font-weight:400}
.nav-links{display:flex;gap:4px;align-items:center}
.nav-links a{font-size:14px;color:var(--muted);padding:6px 10px;border-radius:8px;transition:color 150ms ease,background-color 150ms ease}
@media (hover:hover) and (pointer:fine){.nav-links a:hover{color:var(--text);background:var(--surface-2)}}
@media (max-width:560px){.nav-links a.hide-sm{display:none}}
.theme-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:transform 160ms var(--ease-out)}
.theme-btn:active{transform:scale(0.95)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:11px;font-family:inherit;font-size:14px;font-weight:500;line-height:1;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;transition:transform 160ms var(--ease-out),background-color 150ms ease,border-color 150ms ease,opacity 150ms ease;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.btn[disabled]{opacity:.6;cursor:progress}
@media (hover:hover) and (pointer:fine){.btn:hover{border-color:color-mix(in srgb,var(--text) 25%,var(--line))}}

.hero{padding:48px 0 20px}
.crumb{font-size:13px;color:var(--faint)}.crumb a{color:var(--muted)}
h1{font-size:clamp(30px,5vw,44px);line-height:1.08;letter-spacing:-.03em;font-weight:600;margin:12px 0 10px}
.lede{color:var(--muted);font-size:16px;max-width:60ch}
.enter{opacity:0;transform:translateY(8px);animation:enter 500ms var(--ease-out) forwards}
.enter:nth-child(2){animation-delay:50ms}.enter:nth-child(3){animation-delay:100ms}
@keyframes enter{to{opacity:1;transform:none}}

.layout{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;padding:20px 0 64px}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
fieldset{border:0;display:grid;gap:14px}
fieldset + fieldset{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}
legend{font-size:13px;font-weight:600;letter-spacing:.02em;margin-bottom:14px;display:flex;align-items:center;gap:8px}
legend .n{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
label .req{color:var(--danger)}
input,select,textarea{font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;transition:border-color 150ms ease,box-shadow 150ms ease}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.invalid input,.invalid select,.invalid textarea{border-color:var(--danger)}
.err{font-size:12px;color:var(--danger);display:none}
.invalid .err{display:block}

/* segmented pump type */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.seg{grid-template-columns:1fr 1fr}}
.seg label{position:relative;display:block;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;text-align:center;height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;font-weight:500;transition:background-color 150ms ease,border-color 150ms ease,color 150ms ease,transform 160ms var(--ease-out)}
.seg label:active span{transform:scale(0.97)}
.seg input:checked + span{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

/* photo drop */
.drop{position:relative;display:grid;place-items:center;gap:6px;text-align:center;min-height:132px;padding:18px;border:1.5px dashed var(--line);border-radius:12px;background:var(--bg);cursor:pointer;transition:border-color 150ms ease,background-color 150ms ease}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .hint{font-size:13px;color:var(--muted)}
.drop b{color:var(--text);font-weight:500}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line);opacity:0;transform:scale(0.95);animation:pop 200ms var(--ease-out) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb small{position:absolute;left:0;right:0;bottom:0;font-size:10px;background:rgba(0,0,0,.55);color:#fff;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:22px;border-top:1px solid var(--line);align-items:center}
.actions .note{font-size:12px;color:var(--faint);flex-basis:100%}
.hp{position:absolute;left:-9999px}

aside{display:grid;gap:14px;position:sticky;top:76px}
@media (max-width:860px){aside{position:static}}
aside h3{font-size:15px;font-weight:600}
.steps{list-style:none;counter-reset:s;display:grid;gap:12px;margin-top:12px}
.steps li{counter-increment:s;display:flex;gap:10px;font-size:14px;color:var(--muted)}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--text);background:var(--surface-2)}
.direct a{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.direct a:last-child{border-bottom:0}
.direct small{color:var(--muted);font-size:12px;display:block}
.dl{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dl:last-child{border-bottom:0}
.dl img{width:44px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
.dl b{font-size:14px;font-weight:500;display:block}
.dl small{font-size:12px;color:var(--muted)}
footer{padding:28px 0 40px;color:var(--faint);font-size:13px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.enter,.thumb{animation:none;opacity:1;transform:none}}
.done{max-width:560px;margin:72px auto;text-align:center;padding:0 20px}
.tick{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 18px}
.tick path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw 400ms 200ms var(--ease-out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done p{color:var(--muted);margin-top:8px}
.done .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
@media (prefers-reduced-motion:reduce){.tick path{animation:none;stroke-dashoffset:0}}
.state{min-height:60vh;display:grid;place-items:center;text-align:center;padding:40px 20px}.state p{color:var(--muted);margin:8px 0 20px}
</style>
</head>
<body data-page="inquiry">
<div id="app"></div>
<script src="../assets/config.js"></script>
<script src="../assets/defaults.js"></script>
<script src="../assets/store.js"></script>
<script src="../assets/thanks.js"></script>
</body>
</html>
