<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vacuum Applications</title>
<meta name="description" content="Where industrial vacuum does the work: drying, distillation, packaging, freeze drying, transformer drying, solar, battery, furnaces, medical and more — with vacuum ranges, typical pumps, common problems and the spares that fix them.">
<meta property="og:title" content="Vacuum Applications | Mechvac Technologies">
<meta property="og:description" content="14 industrial vacuum applications explained: vacuum range, typical pumps, what goes wrong and what fixes it.">
<meta property="og:image" content="https://het-patel.work.gd/application/img/mechvac-pumps.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 1.5 21.5 7v10L12 22.5 2.5 17V7Z' fill='%230b8aa3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbfbfa; --surface:#ffffff; --surface-2:#f3f3f1; --line:#e7e7e3;
  --text:#121212; --muted:#6b6b66; --faint:#9a9a94;
  --accent:#0b8aa3; --accent-ink:#ffffff; --accent-soft:#e3f3f6;
  --art:#f2f8f9;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --radius:14px;
  --shadow:0 1px 0 rgba(0,0,0,.03),0 8px 24px -12px rgba(0,0,0,.12);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0c; --surface:#141414; --surface-2:#1b1b1b; --line:#262626;
    --text:#ededed; --muted:#a1a1a1; --faint:#6e6e6e;
    --accent:#3cc3dc; --accent-ink:#06262d; --accent-soft:#0f2a30;
    --art:#e9f1f3;
    --shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c0c; --surface:#141414; --surface-2:#1b1b1b; --line:#262626;
  --text:#ededed; --muted:#a1a1a1; --faint:#6e6e6e;
  --accent:#3cc3dc; --accent-ink:#06262d; --accent-soft:#0f2a30;
  --art:#e9f1f3;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent;transition:border-color 200ms ease}
.nav.scrolled{border-bottom-color:var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .back{color:var(--faint);font-weight:400}
.nav-links{display:flex;gap:4px;align-items:center}
.nav-links a{font-size:14px;color:var(--muted);padding:6px 10px;border-radius:8px;transition:color 150ms ease,background-color 150ms ease}
.nav-links a[aria-current]{color:var(--text)}
@media (hover:hover) and (pointer:fine){.nav-links a:hover{color:var(--text);background:var(--surface-2)}}
@media (max-width:560px){.nav-links a.hide-sm{display:none}}
.theme-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:transform 160ms var(--ease-out)}
.theme-btn:active{transform:scale(0.95)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font:500 14px/1 Inter,system-ui,sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;transition:transform 160ms var(--ease-out),background-color 150ms ease,border-color 150ms ease;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
@media (hover:hover) and (pointer:fine){.btn:hover{border-color:color-mix(in srgb,var(--text) 25%,var(--line))}.btn.primary:hover{background:color-mix(in srgb,var(--text) 86%,var(--bg))}}

/* hero */
.hero{padding:56px 0 24px}
.crumb{font-size:13px;color:var(--faint)}
.crumb a{color:var(--muted)}
h1{font-size:clamp(32px,5.6vw,52px);line-height:1.05;letter-spacing:-.035em;font-weight:600;margin:14px 0}
h1 .soft{color:var(--faint)}
.lede{font-size:17px;color:var(--muted);max-width:60ch}
.hero-art{margin-top:32px;border-radius:20px;background:#fff;border:1px solid var(--line);overflow:hidden;position:relative}
.hero-art img{width:100%;height:auto;aspect-ratio:1818/1201;object-fit:cover;max-height:440px;object-position:center 40%}
.hero-art figcaption{position:absolute;left:16px;bottom:14px;font-size:12px;color:#5f6b70;background:rgba(255,255,255,.85);padding:4px 10px;border-radius:999px;backdrop-filter:blur(6px)}
.enter{opacity:0;transform:translateY(8px);filter:blur(4px);animation:enter 600ms var(--ease-out) forwards}
.enter:nth-child(2){animation-delay:60ms}.enter:nth-child(3){animation-delay:120ms}.enter:nth-child(4){animation-delay:180ms}.enter:nth-child(5){animation-delay:240ms}
@keyframes enter{to{opacity:1;transform:none;filter:blur(0)}}

/* scale legend */
.scale{margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:720px){.scale{grid-template-columns:1fr}}
.scale div{padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.scale b{display:block;font-size:14px;font-weight:600}
.scale span{font-size:13px;color:var(--muted)}
.scale i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}

/* sections */
section{padding:56px 0}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.sec-head .num{font-size:12px;color:var(--faint)}
h2{font-size:24px;letter-spacing:-.025em;font-weight:600}
.sec-sub{color:var(--muted);max-width:64ch;margin-bottom:22px}
h3{font-size:16px;font-weight:600;letter-spacing:-.01em}

/* filters */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px 18px;position:sticky;top:56px;z-index:5;background:var(--bg);padding-block:10px}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 13px/1 Inter,system-ui,sans-serif;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:background-color 150ms ease,color 150ms ease,border-color 150ms ease,transform 160ms var(--ease-out);-webkit-tap-highlight-color:transparent}
.chip:active{transform:scale(0.96)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .n{opacity:.55;margin-left:4px;font-variant-numeric:tabular-nums}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:880px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.app{all:unset;box-sizing:border-box;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform 160ms var(--ease-out),border-color 150ms ease,box-shadow 200ms ease;-webkit-tap-highlight-color:transparent}
.app:active{transform:scale(0.98)}
.app:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover) and (pointer:fine){
  .app:hover{border-color:color-mix(in srgb,var(--text) 18%,var(--line));box-shadow:var(--shadow)}
  .app:hover .art img{transform:scale(1.03)}
}
.art{background:var(--art);aspect-ratio:16/10;overflow:hidden;border-bottom:1px solid var(--line)}
.art img{width:100%;height:100%;object-fit:contain;transition:transform 300ms var(--ease-out)}
.app-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.ind-tag{font-size:12px;color:var(--accent);font-weight:500}
.app p{font-size:14px;color:var(--muted)}
.app .more{margin-top:auto;padding-top:8px;font-size:13px;color:var(--text);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.app .more span:last-child{color:var(--faint)}
.app[hidden]{display:none}

/* range bar */
.range{position:relative;height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.range b{position:absolute;top:-1px;bottom:-1px;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#24404f))}
.range-lg{height:10px;margin-top:10px}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px;font-variant-numeric:tabular-nums}
.range-val{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* approach */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;counter-reset:s}
@media (max-width:820px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;counter-increment:s}
.step::before{content:"0" counter(s);font:500 12px "JetBrains Mono",monospace;color:var(--accent);display:block;margin-bottom:10px}
.step p{font-size:14px;color:var(--muted);margin-top:6px}

/* services */
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
@media (max-width:820px){.svc{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.svc{grid-template-columns:1fr}}
.svc div{background:var(--surface);padding:20px}
.svc .ic{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:12px}
.svc p{font-size:14px;color:var(--muted);margin-top:6px}

/* cta */
.cta{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:28px;border-radius:20px;background:var(--text);color:var(--bg)}
.cta h2{color:var(--bg)}
.cta p{color:color-mix(in srgb,var(--bg) 70%,var(--text));font-size:15px;margin-top:6px;max-width:52ch}
.cta .btn{background:var(--bg);color:var(--text);border-color:var(--bg)}
.cta .btn.ghost{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,var(--text))}

footer{padding:36px 0 52px;color:var(--faint);font-size:13px;border-top:1px solid var(--line);margin-top:32px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* reveal */
.reveal{opacity:0;transform:translateY(12px);transition:opacity 500ms var(--ease-out),transform 500ms var(--ease-out)}
.reveal.in{opacity:1;transform:none}

/* dialog (modal: centered origin) */
dialog{border:0;padding:0;background:transparent;max-width:min(860px,calc(100vw - 24px));width:100%;max-height:calc(100dvh - 24px);margin:auto;color:var(--text)}
dialog::backdrop{background:rgba(10,12,14,.5);backdrop-filter:blur(3px);opacity:0;transition:opacity 200ms ease}
dialog.show::backdrop{opacity:1}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:auto;max-height:calc(100dvh - 24px);opacity:0;transform:scale(0.96) translateY(6px);transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog.show .sheet{opacity:1;transform:none}
dialog.closing .sheet{transition-duration:140ms}
.sheet-top{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:720px){.sheet-top{grid-template-columns:1fr}}
.sheet-art{background:var(--art);display:grid;place-items:center;min-height:220px}
.sheet-art img{width:100%;height:100%;object-fit:contain}
.sheet-head{padding:24px 24px 20px;display:flex;flex-direction:column;gap:10px}
.sheet-head h2{font-size:26px}
.sheet-head p{color:var(--muted)}
.close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;z-index:2;transition:transform 160ms var(--ease-out)}
.close:active{transform:scale(0.94)}
.sheet-body{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
@media (max-width:720px){.sheet-body{grid-template-columns:1fr}}
.sheet-body > div{background:var(--surface);padding:20px 22px}
.sheet-body h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:500;margin-bottom:10px}
.sheet-body ul{list-style:none;display:grid;gap:8px}
.sheet-body li{font-size:14px;color:var(--muted);padding-left:16px;position:relative}
.sheet-body li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:1px;background:var(--faint)}
.sheet-body .fix li::before{content:"→";background:none;width:auto;height:auto;top:0;color:var(--accent);font-size:12px}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 22px;border-top:1px solid var(--line)}
.sheet-foot small{color:var(--muted);font-size:13px}
.sheet-foot .btns{display:flex;gap:8px;flex-wrap:wrap}
.nextprev{display:flex;gap:6px}
.nextprev button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:transform 160ms var(--ease-out)}
.nextprev button:active{transform:scale(0.94)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .enter{animation:fade 200ms ease forwards;transform:none;filter:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .reveal{transform:none;transition:opacity 200ms ease}
  .sheet{transform:none}
  .art img{transition:none}
}
.state{min-height:60vh;display:grid;place-items:center;text-align:center;padding:40px 20px}.state p{color:var(--muted);margin:8px 0 20px}
</style>
</head>
<body>
<div id="app"></div>
<script src="../assets/config.js"></script>
<script src="../assets/defaults.js"></script>
<script src="../assets/store.js"></script>
<script src="../assets/applications.js"></script>
</body>
</html>
